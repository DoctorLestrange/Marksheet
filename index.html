<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Marksheet — Exam Score Calculator</title>
    <meta name="description" content="An accurate exam score calculator with question-by-question mark records, negative marking, session history, and persistent localStorage configuration." />
    <meta property="og:title" content="Marksheet — Exam Score Calculator" />
    <meta property="og:description" content="An accurate exam score calculator with question-by-question mark records, negative marking, session history, and persistent localStorage configuration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('marksheet_theme_v1');
        } catch (e) {}
        try {
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#141415');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7F9] dark:bg-[#141415] text-[#0F172A] dark:text-[#F2F2F4] antialiased selection:bg-[#1D4ED8]/15 dark:selection:bg-[#52525B]/40 selection:text-[#1D4ED8] dark:selection:text-[#F2F2F4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
